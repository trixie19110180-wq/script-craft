services:
  - type: web
    name: scriptcraft
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/scriptcraft.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_COOKIE_NAME
        value: scriptcraft_session
      - key: SESSION_DAYS
        value: 14
      - key: MAX_UPLOAD_MB
        value: 8
    disk:
      name: scriptcraft-data
      mountPath: /var/data
      sizeGB: 1
